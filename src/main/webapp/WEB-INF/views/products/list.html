<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produits - Spring Hibernate Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        nav {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        nav a {
            padding: 8px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }
        
        nav a:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }
        
        .content {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85em;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
        }
        
        .btn-add {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            box-shadow: 0 3px 10px rgba(76, 175, 80, 0.3);
            padding: 10px 20px;
        }
        
        .btn-add:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.6);
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        
        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }
        
        .product-image {
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 4em;
        }
        
        .product-body {
            padding: 20px;
        }
        
        .product-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .product-price {
            font-size: 1.8em;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .product-category {
            display: inline-block;
            padding: 5px 15px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
        }
        
        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .btn-edit {
            flex: 1;
            background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
            color: white;
            justify-content: center;
        }
        
        .btn-delete {
            flex: 1;
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            color: white;
            justify-content: center;
        }
        
        .btn-edit:hover, .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-box"></i> Gestion des Produits</h1>
        </header>

        <nav>
            <a href="/"><i class="fas fa-home"></i> Accueil</a>
            <a href="/products" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);"><i class="fas fa-box"></i> Produits</a>
            <a href="/categories"><i class="fas fa-folder"></i> Catégories</a>
        </nav>

        <div class="content">
            <div class="header-actions">
                <h2 style="color: #333;">Tous les Produits</h2>
                <a href="/products/new" class="btn btn-add">
                    <i class="fas fa-plus"></i> Nouveau Produit
                </a>
            </div>

            <div class="products-grid">
                <div class="product-card" th:each="product : ${products}">
                    <div class="product-image">
                        <i class="fas fa-box"></i>
                    </div>
                    <div class="product-body">
                        <div class="product-title" th:text="${product.name}">Nom du produit</div>
                        <div class="product-price" th:text="${product.price} + ' €'">0.00 €</div>
                        <span class="product-category">
                            <i class="fas fa-tag"></i>
                            <span th:text="${product.category != null ? product.category.name : 'Aucune'}">Catégorie</span>
                        </span>
                        <div class="product-actions">
                            <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-edit">
                                <i class="fas fa-edit"></i> Modifier
                            </a>
                            <a th:href="@{/products/delete/{id}(id=${product.id})}" 
                               class="btn btn-delete" 
                               onclick="return confirm('Supprimer ce produit ?')">
                                <i class="fas fa-trash"></i> Supprimer
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(products)}" style="text-align: center; padding: 60px; color: #666;">
                <i class="fas fa-inbox" style="font-size: 5em; color: #ddd; margin-bottom: 20px;"></i>
                <h3>Aucun produit trouvé</h3>
                <p>Commencez par ajouter votre premier produit !</p>
            </div>
        </div>
    </div>
</body>
</html>
